[project]
name = "reverse-engineer-growth"
version = "0.2.0"
description = "Reverse engineer growth systems: one lever, not forty tactics. By Ventaja."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ventaja", email = "hola@ventaja.com.mx" }]
dependencies = []

[project.urls]
Homepage = "https://ventaja.com.mx"
IAC = "https://iac.ventaja.com.mx"

[project.scripts]
reg = "reg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
